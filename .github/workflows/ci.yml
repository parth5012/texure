name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Texure Custom Lint (P0 docs-gate & scenario DSL)
        run: cargo run -p texure-lint -- --report tmp/evidence/lint-report.json

  rust-test:
    name: Rust Tests (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Unit & Integration Tests
        run: cargo test --workspace --verbose

  android-build:
    name: Android Build & Leak Probe
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android code existence
        id: check-android
        run: |
          if [ -f "android/build.gradle.kts" ] || [ -f "android/build.gradle" ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
            echo "Android plugin/sample not yet present. Skipping cleanly."
          fi

      - name: Set up JDK 17
        if: steps.check-android.outputs.has_android == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Assemble Debug & Probe
        if: steps.check-android.outputs.has_android == 'true'
        run: |
          cd android && ./gradlew assembleDebug --no-daemon

  release:
    name: Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-test, android-build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: texure
            asset_name: texure-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: texure.exe
            asset_name: texure-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: texure
            asset_name: texure-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary (placeholder until texure crate lands)
        shell: bash
        run: |
          if cargo metadata --format-version 1 | grep -q '"name":"texure"'; then
            cargo build --release --target ${{ matrix.target }} -p texure
          else
            echo "Crate 'texure' not yet present in workspace. Skipping release artifact packaging."
          fi
